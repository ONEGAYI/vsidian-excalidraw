name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    outputs:
      vsix: ${{ steps.candidate.outputs.vsix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: 核对标签并定位同一提交的 CI 产物
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::The release tag must point to a commit on main."
            exit 1
          fi
          commit="$(git rev-parse HEAD)"
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --event push --branch main --commit "$commit" --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful main CI run for $commit. Wait for CI and rerun the failed job."
            exit 1
          fi
          name="$(node -p "require('./package.json').name")"
          printf 'run_id=%s\nvsix=%s-%s.vsix\n' "$run_id" "$name" "$version" >> "$GITHUB_OUTPUT"
      - name: 用 CI 产物创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.candidate.outputs.run_id }}
          VSIX: ${{ steps.candidate.outputs.vsix }}
        run: |
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name vsix --dir out
          gh release create "$GITHUB_REF_NAME" "out/$VSIX" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --notes-from-tag --title "Vsidian Excalidraw $GITHUB_REF_NAME"

  marketplace:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 从 GitHub Release 下载 VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          VSIX: ${{ needs.release.outputs.vsix }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$VSIX" --dir out
      - name: 发布到 VS Code Marketplace
        env:
          VSIX: ${{ needs.release.outputs.vsix }}
        run: ./node_modules/.bin/vsce publish --oidc --packagePath "out/$VSIX"
